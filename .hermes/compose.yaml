# Rodado .hermes: Hermes Agent + Kanban for this repo (model provider: Anthropic).
# Run from this folder:  docker compose up -d
# Dashboard: http://localhost:${HERMES_PORT:-9119} (chat, kanban, profiles, skills, cron)
name: rodado
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: rodado-hermes
    restart: unless-stopped
    working_dir: /workspace/rodado            # Hermes starts in the repo, not in its own source folder
    command: gateway run                      # runs the kanban dispatcher and cron jobs
    env_file: .env
    environment:
      - HERMES_DASHBOARD=1
      - TERMINAL_CWD=/workspace/rodado          # where every session starts (chat, gateway, kanban)
    ports:
      - "127.0.0.1:${HERMES_PORT:-9119}:9119" # localhost only; use Tailscale or an SSH tunnel
    volumes:
      - ./data:/opt/data                      # Hermes state: config, keys, profiles, memory, kanban (not in git)
      - ./themes:/opt/data/dashboard-themes:ro
      - ..:/workspace/rodado                  # the whole repo; agents work here
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
